name: Whistic
description: >-
  Whistic is an AI-driven Third-Party Risk Management (TPRM) platform that helps
  organizations assess vendor security, monitor third-party risk continuously, and
  share their own security posture through a Trust Center. The platform combines
  assessment AI (automated questionnaire responses and SOC 2 summarization), vendor
  monitoring with breach detection and structured alerts, compliance controls testing,
  and a Trust Center Exchange of verified security information for thousands of vendors.
  It integrates with Jira, Salesforce, Slack, and BitSight. Whistic itself holds SOC 2,
  ISO 27001, ISO 42001, NIST, GDPR, TX-RAMP, and START Level One / Shared Assessments
  certifications, backed by Battery Ventures and Emergence Capital.
